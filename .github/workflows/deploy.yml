name: Build and deploy frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: frontend-deploy
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: |
            dist
            deploy/nginx.conf

  deploy:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: deploy-artifact
      - name: Upload frontend artifact
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: deploy-artifact/dist,deploy-artifact/deploy/nginx.conf
          target: /opt/my-love-frontend-deploy
          timeout: 60s
          command_timeout: 10m
          debug: true
      - name: Deploy on server
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          port: ${{ secrets.DEPLOY_PORT }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script_stop: true
          script: |
            set -eu
            APP_DIR=/opt/my-love-frontend-deploy/deploy-artifact
            mkdir -p "$APP_DIR"
            docker rm -f my-love-frontend 2>/dev/null || true
            docker pull nginx:1.27-alpine
            docker run -d --name my-love-frontend --restart unless-stopped \
              --add-host host.docker.internal:host-gateway \
              -p 80:80 \
              -v "$APP_DIR/dist:/usr/share/nginx/html:ro" \
              -v "$APP_DIR/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" \
              nginx:1.27-alpine
            sleep 2
            curl --fail --silent http://127.0.0.1/ >/dev/null
